name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Smoke-test production preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/awesome-site-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:36265/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:36265/ >/dev/null
          curl --fail --silent http://127.0.0.1:36265/awesome/awesome-github-profile-readme/ >/dev/null
        env:
          SITE_URL: http://localhost:36265
        shell: bash
    env:
      SITE_URL: http://localhost:36265
