name: Publish Awesome Site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: awesome-site-gh-pages
  cancel-in-progress: false

env:
  PUBLICATION_DIR: .deploy/gh-pages

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Validate production origin
        run: node scripts/validate-production-origin.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
        # CI runs the full suite (including the slow content-pipeline
        # integration tests and astro check) on the same commit; publishing
        # only re-verifies the fast subset to keep deploys short.
        env:
          AWESOME_TEST_FAST: "1"
      - name: Assemble publication payload
        run: |
          mkdir -p "$PUBLICATION_DIR/dist"
          cp .github/gh-pages/esa.jsonc "$PUBLICATION_DIR/esa.jsonc"
          cp .github/gh-pages/wrangler.jsonc "$PUBLICATION_DIR/wrangler.jsonc"
          cp -R dist/. "$PUBLICATION_DIR/dist/"
      - uses: actions/upload-artifact@v4
        with:
          name: awesome-site-dist
          path: .deploy/gh-pages/
          if-no-files-found: error
          retention-days: 1

  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: awesome-site-dist
          path: .deploy/gh-pages/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.deploy/gh-pages
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
